name: x32-router
services:
  x32-router:
    image: ghcr.io/daviied/x32-router:latest
    container_name: x32-router
    restart: unless-stopped
    # Host networking lets "Find console" broadcast on your LAN (like X32-Edit).
    # The app listens on PORT on the Pi itself. Dante is not affected.
    network_mode: host
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      X32_IP: ${X32_IP:-}
      X32_MOCK: ${X32_MOCK:-0}
      PORT: ${PORT:-8080}
    volumes:
      - /DATA/AppData/x32-router:/data
x-casaos:
  main: x32-router
  title:
    en_us: X32 Router
  description:
    en_us: Web app for X32 stage box routing over OSC.
  port_map: "8080"
  category: Utilities
